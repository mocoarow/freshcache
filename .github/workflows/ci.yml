name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [freshcache, freshcache-http, freshcache-server]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage
        working-directory: ${{ matrix.module }}
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 80%"
            exit 1
          fi

  build-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Build examples
        working-directory: examples
        run: go build ./...

  vet:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [freshcache, freshcache-http, freshcache-server, examples]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [freshcache, freshcache-http, freshcache-server, examples]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: ${{ matrix.module }}
